[project]
name = "meetwise"
version = "0.0.1"
description = "Offline meeting-audio pipeline: decode, quality gate, VAD, speaker hints, language routing, ASR with guards, cited summary."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "onnxruntime>=1.20"]

[project.optional-dependencies]
# The model runners (meetwise.runners and the CLI). For CUDA, install llama-cpp-python built with
# CMAKE_ARGS="-DGGML_CUDA=on"; the default build runs the LLM on the CPU.
runners = [
    "faster-whisper>=1.1",
    "llama-cpp-python>=0.3.8",
    "pyannote-audio>=3.3,<4",
    "pyyaml>=6",
    "speechbrain>=1.0,<1.2",
    "torch>=2.5,<2.9",
    "torchaudio>=2.5,<2.9",
]

[project.scripts]
meetwise = "meetwise.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetwise"]

[dependency-groups]
dev = ["import-linter>=2.1", "pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

# The pipeline imports no network client: models are downloaded by scripts/fetch_models.py only.
[tool.importlinter]
root_packages = ["meetwise"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "No network clients"
type = "forbidden"
source_modules = ["meetwise"]
forbidden_modules = ["httpx", "requests", "urllib3", "aiohttp", "boto3", "botocore", "google", "openai", "anthropic"]
