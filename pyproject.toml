[project]
name = "meetwise"
version = "0.0.1"
description = "Offline meeting-audio pipeline: decode, quality gate, VAD, speaker hints, language routing, ASR with guards, cited summary."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "onnxruntime>=1.20"]

[project.optional-dependencies]
# Model runners for Linux are added in the next step (faster-whisper, pyannote, llama.cpp).

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetwise"]

[dependency-groups]
dev = ["import-linter>=2.1", "pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

# The pipeline imports no network client: models are downloaded by scripts/fetch_models.py only.
[tool.importlinter]
root_packages = ["meetwise"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "No network clients"
type = "forbidden"
source_modules = ["meetwise"]
forbidden_modules = ["httpx", "requests", "urllib3", "aiohttp", "boto3", "botocore", "google", "openai", "anthropic"]
